<!DOCTYPE html>
<html>
<head>
    <title> city map </title>

</head>

<body>
    


<iframe
  title="Map showing Agra, India"
  max width="600"
 max height="450"
  loading="lazy"
  src="https://www.google.com/maps?q=Agra,+India&output=embed"
  
  frameborder="0"
  allowfullscreen>
</iframe>

<!--
  What the loading="lazy" attribute does:
  It delays loading the iframe content until the user is about to scroll to it,
  which helps improve page performance and saves data.
-->


</html>
